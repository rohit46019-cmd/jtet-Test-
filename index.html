<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Flash - AI Powered Quiz Master</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.jpg">
    <link rel="apple-touch-icon" href="/icon.jpg">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Quiz Flash">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 10px;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px rgba(37,99,235,0.6)); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s ease-in-out infinite;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="overflow-x-hidden bg-slate-900 text-slate-50">
    <div id="root">
        <!-- Instant Preloader so screen is never white -->
        <div id="app-preloader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a; color: #ffffff; padding: 20px; text-align: center;">
            <div style="width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(135deg, #2563eb, #4f46e5); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4); margin-bottom: 20px; animation: pulse-glow 2s ease-in-out infinite;">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </div>
            <h1 style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 8px 0;">Quiz Flash</h1>
            <p style="font-size: 13px; color: #94a3b8; margin: 0 0 24px 0; font-weight: 500;">Loading Tests & Database...</p>
            <div style="width: 48px; height: 48px; border: 3px solid rgba(37, 99, 235, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <style>
                @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            </style>
        </div>
    </div>

    <!-- Safety script to handle stale caches and service workers -->
    <script>
      // Register or update Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
            console.log('SW active:', reg.scope);
          }).catch((err) => {
            console.warn('SW register note:', err);
          });
        });
      }

      // Fallback timer: if React fails to mount within 6s (e.g. slow network or corrupt cache), show recovery button
      setTimeout(() => {
        const preloader = document.getElementById('app-preloader');
        if (preloader) {
          preloader.innerHTML = `
            <div style="width: 64px; height: 64px; border-radius: 20px; background: rgba(37,99,235,0.2); display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
              <span style="font-size: 28px;">⚡</span>
            </div>
            <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">Quiz Flash</h2>
            <p style="font-size: 13px; color: #94a3b8; max-width: 300px; margin-bottom: 20px;">App start hone me time lag raha hai. Refresh dabayein:</p>
            <button onclick="window.location.reload(true)" style="padding: 12px 24px; background: #2563eb; color: #fff; font-weight: 700; border: none; border-radius: 14px; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,0.4);">
              🔄 Refresh App
            </button>
          `;
        }
      }, 6000);
    </script>

    <script type="module" src="/index.tsx"></script>
</body>
</html>
